<!DOCTYPE html>
<html lang="en">
<head>
  <!-- GenAI declaration: this dashboard was built with the assistance of Claude (Anthropic) in conversation with the team.
       The team reviewed, tested and adapted the code. Edit this note to match the unit's GenAI declaration rules. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview | Hospitalised Road Crash Injuries in Australia (2011–2021)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-dbar">
  <header class="dh">
    <div class="dh-bg" aria-hidden="true">
      <img class="on" src="photos/car%20crash%201.jpeg" alt="">
      <img src="photos/car%20crash%202.jpeg" alt="">
      <img src="photos/car%20crash%203.jpeg" alt="">
    </div>
    <div class="dh-title">
      <p class="kicker">COS30045 Data Visualisation, Group 7</p>
      <h1>Hospitalised Road Crash Injuries in Australia <span>(2011–2021)</span></h1>
    </div>
    <div class="dh-kpis" id="kpis" aria-label="Key numbers"></div>
    <nav class="nav" aria-label="Pages">
      <a href="index.html" aria-current="page">Overview</a>
      <a href="trends.html">Year by year</a>
      <a href="compare.html">Compare</a>
      <a href="data.html">Data</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="dash">
    <!-- Story step 1: how much, and how has it changed? -->
    <article class="panel p-trend">
      <div class="ph"><div class="q"><span class="num">1</span><div><h3>How has it changed?</h3><p class="sub" id="line-sub"></p></div></div></div>
      <div class="controls">
        <div class="seg" id="line-metric" role="group" aria-label="Measure"><button type="button" class="on" data-m="cases" aria-pressed="true">Cases</button><button type="button" data-m="beds" aria-pressed="false">Bed days</button><button type="button" data-m="cmp" aria-pressed="false">Compare</button></div>
        <select id="yr-from" aria-label="From year"></select>
        <select id="yr-to" aria-label="To year"></select>
        <button type="button" id="yr-play" class="btn">Play</button>
      </div>
      <div class="chart" id="line-chart"></div>
      <p class="take" id="line-take"></p>
    </article>

    <!-- Story step 2: who is affected most often? -->
    <article class="panel p-bars">
      <div class="ph"><div class="q"><span class="num">2</span><div><h3>Who is hit hardest?</h3><p class="sub" id="bar-sub"></p></div></div></div>
      <div class="controls">
        <div class="seg" id="bar-metric" role="group" aria-label="Measure"><button type="button" class="on" data-m="cases" aria-pressed="true">Cases</button><button type="button" data-m="beds" aria-pressed="false">Bed days</button><button type="button" data-m="avg" aria-pressed="false">Per case</button></div>
        <button type="button" id="clear-pick" class="btn ghost">Clear</button>
      </div>
      <div class="chart" id="bar-chart"></div>
      <p class="take" id="bar-take"></p>
    </article>

    <!-- Story step 3: who is hurt most seriously? -->
    <article class="panel p-bubble">
      <div class="ph"><div class="q"><span class="num">3</span><div><h3>Who is hurt most seriously?</h3><p class="sub">Right = more cases. Up = longer stays. Bigger = more bed days.</p></div></div></div>
      <div class="chart" id="bubble-chart"></div>
      <p class="take" id="bubble-take"></p>
    </article>
  </main>

  <section class="dbar" id="dbar" aria-live="polite" aria-label="Selected road user"></section>

  <div class="tip" id="tip" role="status" hidden></div>
  <script src="js/effects.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/common.js"></script>
  <script src="js/overview.js"></script>
</body>
</html>
